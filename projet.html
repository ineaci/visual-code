<!DOCTYPE html>
<!-- on indique au navigateur que c'est une page HTML, et que le site est en français -->
<html lang="fr">


<!-- CONFIGURATION DE LA PAGE                     -->
<!-- (le titre est remplacé par projet.js)        -->

<head>
  <!-- permet d'afficher correctement les accents et les caractères spéciaux -->
  <meta charset="UTF-8">
  <!-- adapte la page à la taille de l'écran (important pour le téléphone) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- titre provisoire de l'onglet, projet.js le remplace par le nom du projet affiché -->
  <title>Projet — Inea Civaux</title>

  <!-- ces deux lignes préparent la connexion à Google Fonts pour que les polices se chargent plus vite -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- ici on télécharge vraiment les 3 polices (Bodoni Moda, Cormorant Garamond, Jost) -->
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <!-- on relie la page à style.css, le même fichier que pour la page d'accueil -->
  <link rel="stylesheet" href="style.css">
</head>

<!-- tout ce qui est dans le body est ce qu'on voit à l'écran -->
<body>

 
  <!-- EN-TÊTE                                      -->

  <header>
    <!-- mon logo : ici un clic ramène à la page d'accueil (index.html) -->
    <a href="index.html" class="logo">Inea.C</a>
    <!-- le menu : comme on est sur une autre page, les liens
